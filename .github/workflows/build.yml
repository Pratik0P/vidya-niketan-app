name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          ls -lh
          test -f VidyaNiketanPortal-Android-Project.zip
          rm -rf project
          unzip -q VidyaNiketanPortal-Android-Project.zip -d project
          find project -type f | sort
          test -f project/settings.gradle.kts

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --console=plain --no-daemon > ../build-log.txt 2>&1

      - name: Show errors
        if: failure()
        run: |
          grep -n -B2 -A12 "What went wrong\|^e: \|error:" build-log.txt | head -n 80 || true
          echo ----- LAST 40 LINES -----
          tail -n 40 build-log.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore
